<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- <link rel="icon" href="%PUBLIC_URL%/favicon.ico" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Junomi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script>
      (function() {
        // 1. Zjistíme uložené téma
        var savedTheme = localStorage.getItem('theme');
        var theme = 'dark'; // Výchozí

        if (savedTheme) {
          theme = savedTheme;
        }

        // 2. Okamžitě nastavíme třídu a barvu pozadí na HTML element
        // Poznámka: Nepřistupujeme zde k document.body, protože v head ještě neexistuje
        if (theme === 'dark') {
          document.documentElement.classList.add('dark-mode');
          document.documentElement.style.backgroundColor = '#000000'; // Hard set
        } else {
          document.documentElement.classList.add('light-mode');
          document.documentElement.style.backgroundColor = '#ffffff'; // Hard set
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root"></div>
    
  </body>
</html>
