    <!-- Theme Script (Dark/Light mode) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme') || 'dark';
          // Volitelné: Zohlednění systémového nastavení, pokud není nic uloženo
          // if (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: light)').matches) {
          //   savedTheme = 'light';
          // }

          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark-mode');
            document.documentElement.style.backgroundColor = '#000000';
          } else {
            document.documentElement.classList.add('light-mode');
            document.documentElement.style.backgroundColor = '#ffffff';
          }
        } catch (e) {
          console.error('Chyba při nastavování tématu:', e);
        }
      })();
    </script>
    
    <style>
      /* Základní reset a nastavení */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body, html {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Raleway', sans-serif; /* Aplikování načteného fontu */
        -webkit-font-smoothing: antialiased; /* Hezčí vykreslování písma */
        -moz-osx-font-smoothing: grayscale;
      }

      /* Zde můžete přidat globální proměnné pro barvy, pokud je používáte v JS */
      :root {
        --bg-color: #ffffff;
        --text-color: #000000;
      }
      
      .dark-mode {
        --bg-color: #000000;
        --text-color: #ffffff;
      }
    </style>
  </head>
